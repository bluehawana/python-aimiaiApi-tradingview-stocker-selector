# Multi-Sector Stock Analyzer Configuration
# Covers: Chips, Solid State Batteries, Energy Storage, Solar, Smart Grids, Robots, CPO, New Energy

stocks:
  market: "CN"
  
  # Expanded sector coverage
  sectors:
    # Semiconductor & Chips (芯片半导体)
